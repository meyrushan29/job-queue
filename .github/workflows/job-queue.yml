name: Refresh job queue

on:
  schedule:
    # Every 30 minutes between 03:00 and 15:00 UTC = 08:30 to 20:30 Sri Lanka time.
    - cron: "0,30 3-15 * * *"
  workflow_dispatch:        # lets you run it by hand from the Actions tab
  push:
    branches: [main]        # rebuild when you change the filters

permissions:
  contents: write           # to commit seen.json and jobs.json
  pages: write              # to publish the dashboard
  id-token: write

concurrency:
  group: job-queue
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and score current openings
        env:
          # Optional. Leave these secrets unset and Telegram is simply skipped.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python job_alert.py

      - name: Commit the refreshed data
        run: |
          if [[ -n "$(git status --porcelain seen.json docs/jobs.json)" ]]; then
            git config user.name "job-queue-bot"
            git config user.email "actions@github.com"
            git add seen.json docs/jobs.json
            git commit -m "Refresh job queue [skip ci]"
            git push
          else
            echo "Nothing changed since the last run"
          fi

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
